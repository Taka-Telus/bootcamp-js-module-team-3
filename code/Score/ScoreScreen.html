<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriviaBlast - ScoreScreen</title>
</head>

<body>
    <header>
        <h1>TriviaBlast</h1>
        <div>
            <span>Puntaje:</span>
            <span id="numero"></span>
        </div>
    </header>
    <section>
        <h2>BUEN TRABAJO!</h2>
        <p>Tu puntaje:</p>
        <div>
            <span id="score"></span>
            <span style="padding-left: 10px;" id="CorrectAns"></span>
        </div>

        <div>
            <h3>ScoreBoard Global</h3>
            <span>Top 5</span>
        </div>

        <span id="leaderboard"></span> <!-- aca va la tabla top 5 -->

        <button id="replay">Jugar de nuevo</button>
        <button id="return">Volver a pagina principal</button>


        <script src="script.js"></script>
    </section>
</body>

</html>
