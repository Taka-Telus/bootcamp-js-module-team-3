<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriviaBlast - ScoreScreen</title>
    <script src="https://kit.fontawesome.com/ada462c236.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://kit.fontawesome.com/ada462c236.js" crossorigin="anonymous"></script>

</head>

<body>

    <header class="header">

        <h1><a href="../HomeScreen/index.html">TriviaBlast</a></h1>

        <div class="score-header">
            <div class="score-header-left">
                <span>Puntaje</span>
                <span id="numero"></span>
            </div>
            <i id="fa_gear" class="fa-solid fa-gear"></i>
        </div>
        

    </header>

    <main class="container">

        <section class="result">

            <i id="trophy" class="fa fa-trophy" aria-hidden="true"></i>

            <h2 id="h2"></h2>

            <p>Has completado el desafío con éxito</p>

            <div class="score-card">

                <span class="texto">TU PUNTAJE FINAL</span>

                <h3 id="score"></h3>

                <div class="stats">
                    <span id="CorrectAns"></span>
                </div>

            </div>

        </section>

        <section class="leaderboard">

            <div class="leader-title">

                <h3><i class="fa-solid fa-ranking-star"></i> Scoreboard Global</h3>

                <div class="leader-actions">
                    <span class="top">Top 5</span>
                    <button id="clearScores" class="clear-btn">Borrar scores</button>
                </div>

            </div>

            <table>

                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Jugador</th>
                        <th>Puntos</th>
                    </tr>
                </thead>

                <tbody id="leaderboard">

                </tbody>

            </table>

        </section>

        <div class="buttons">

            <button id="replay">Jugar otra vez</button>

            <button id="return">Volver al inicio</button>

        </div>
    <canvas id="canvas"></canvas>
    </main>

    <script src="script.js"></script>

</body>

</html>
