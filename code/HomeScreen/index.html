<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MainScreen - TriviaBlast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <div>
            <h1>TriviaBlast</h1>
        </div>
        <div>
            <div>
                <p>Puntaje</p>
                <p id="score"></p>
            </div>
        </div>
    </div>
    <section>
        <div class="Home_Random-Points">
            <h2 id="home/readyName"></h2>
            <div style="background-color: green; text-align: center;">
                <p>1000</p> <!-- aca va el score  -->
                <p>TOTAL POINTS</p>
            </div>
        </div>
    </section>
    <section>
        <ul id="juegos"></ul>
    </section>

    <script>
        const urlAPI = 'https://quiz-api.cesar-kastli.workers.dev/games';

        async function obtenerJuegos() {
            try {
                const respuesta = await fetch(urlAPI);
                const datos = await respuesta.json();
                const contenedor = document.getElementById('juegos');
                datos.forEach((element, index) => {
                    const li = document.createElement("li");
                    li.innerHTML = `
                    <div id='play_content'>
                    <span> titulo: ${element.title}</span>
                    <img src='${element.image}'></img>
                    <button>Editar</button>
                    <button>Jugar</button>
                    </div>`;
                    contenedor.appendChild(li);
                });
            } catch (error) {
                console.error('Error al conectar con la API:', error);
            }
            Array.from(document.getElementsByTagName('button')).forEach(button => {
                button.addEventListener('click', () => {
                    console.log('click')
                })
            })
        }
        obtenerJuegos()

        let name = localStorage.getItem('nombreUsuario')

        if (!name || name.trim() === '') {
            window.location.href = '../LoginScreen/login.html'
        } else {
            const ready = document.getElementById('home/readyName')
            ready.innerHTML = `Ready for a challenge, ${name}?`
        }

    </script>
</body>

</html>
