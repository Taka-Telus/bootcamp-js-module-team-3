<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MainScreen - TriviaBlast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/ada462c236.js" crossorigin="anonymous"></script>
</head>

<body>
    <nav>
        <h1><a href="../HomeScreen/index.html">TriviaBlast</a></h1>
        <div class="derechanav">
            <div class="puntaje">
                <span>Puntaje</span>
                <span>2,450 XP</span>  <!-- aca debe ir puntaje con js -->
            </div>
            <i id="fa_gear" class="fa-solid fa-gear"></i>
        </div>
    </nav>
    <main class="main">
        <section class="header">
            <div class="random-play">
                <div class="random-play-text">
                    <h3 id="home/readyName"></h3>
                    <p>Your daily streak is at 5 days. Complete one more trivia today to unlock the Bronze Badge</p>
                    <div class="random-play-button">
                        <button>
                            <i class="fa-solid fa-rocket"></i>
                            <span>Random Play</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="points">
                <span>2,450</span>
                <span>TOTAL POINTS</span>
            </div>
        </section>
        <h2>Your Games</h2>
        <section class="games-list">
            <ul id="juegos"></ul>
            <button id="addGame">+</button>
        </section>
    </main>

    <script src="script.js"></script>

</body>

</html>
