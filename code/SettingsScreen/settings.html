<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/ada462c236.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav>
        <h1>TriviaBlast</h1>
        <div class="derechanav">
            <div class="puntaje">
                <span>Puntaje</span>
                <span>2,450 XP</span>  <!-- aca debe ir puntaje con js -->
            </div>
            <i id="fa_gear" class="fa-solid fa-gear"></i>
        </div>
    </nav>
    <main>
        <section>
            <h2>Ajustes de juego</h2>
            <p>Personaliza tu experiencia en TriviaBlast. Tus cambios se sincronizan automaticamente.</p>
            <div class="effects">
                <div class="sound">
                    <i class="fa-solid fa-volume"></i>
                    <div>
                        <span>Sonido del juego</span>
                        <p>Efectos de sonido y musica de fondo</p>
                    </div>
                </div>
                <div class="vib">
                    <i class="fa-solid fa-mobile-vibrate"></i>
                    <div>
                        <span>Vibracion</span>
                        <p>Respuesta háptica al acertar</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
