<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar / Editar Juego - TriviaBlast</title>
    <link rel="preconnect" href="fonts.googleapis.com">
    <link rel="preconnect" href="fonts.gstatic.com" crossorigin>
    <link href="fonts.googleapis.com/css2?family=…&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="fonts.googleapis.com">
    <link rel="preconnect" href="fonts.gstatic.com" crossorigin>
    <link href="fonts.googleapis.com/css2?family=…&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <nav>
            <div class="derechanav">
                <h1><a href="../HomeScreen/index.html">TriviaBlast</a></h1>
                <div class="flexRow">
                    <div class="puntaje">
                        <span>Puntaje</span>
                        <span id="exp"></span>
                    </div>
                    <i id="fa_gear" class="fa-solid fa-gear" style="color: gray;"></i>
                </div>
            </div>
        </nav>
    </header>
    <main class="container">
        <h2 id="pageTitle">
            Nuevo Juego
        </h2>

        <form id="gameForm">
            <section class="Information">
                <div class="card">
                    <h3>Información Básica</h3>

                    <label for="title">
                        Título
                    </label>
                    <input type="text" id="title" required>

                    <label for="author">
                        Autor
                    </label>
                    <input type="text" id="author" required>

                    <label for="description">
                        Descripción
                    </label>
                    <textarea id="description" rows="4"></textarea>
                </div>
                <div class="card">
                    <label for="image">
                        Imagen (URL)
                    </label>
                    <input type="url" id="image">

                    <label for="difficulty">
                        Dificultad
                    </label>
                    <select id="difficulty">
                        <option value="Facil">
                            Facil
                        </option>
                        <option value="Medio">
                            Medio
                        </option>
                        <option value="Dificil">
                            Dificil
                        </option>
                    </select>
                </div>
            </section>

            <hr>

            <section class="card">
                <h3>Preguntas</h3>

                <div id="questionsContainer">
                </div>

                <br>

                <button type="button" id="addQuestion">
                    + Agregar Pregunta
                </button>
            </section>

            <hr>

            <section class="buttons">
                <button type="submit" id="saveButton">
                    Guardar Juego
                </button>

                <button type="button" id="deleteButton" style="display:none;">
                    Borrar Juego
                </button>
            </section>
        </form>

        <div id="message"></div>
    </main>

    <script src="script.js"></script>
</body>

</html>
